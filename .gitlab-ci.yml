workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - when: never

default:
  image: node:24.21.0-alpine
  before_script:
    - corepack enable
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/

stages:
  - deps
  - prisma
  - tests
  - build
  - deploy

install_deps:
  stage: deps
  script:
    - yarn --immutable

generate_prisma_client:
  stage: prisma
  script:
    - yarn prisma generate
  artifacts:
    paths:
      - generated/

run_unit_tests:
  stage: tests
  script:
    - yarn run test
  dependencies:
    - generate_prisma_client

run_e2e_tests:
  stage: tests
  services:
    - name: docker:29.8.0-dind-alpine3.24
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    PORT: 3000
    DATABASE_URL: ""
    REDIS_URL: ""
    MAIL_HOST: localhost
    MAIL_PORT: 1025
    MAIL_USER: test
    MAIL_PASS: test
    ACCESS_JWT_SECRET: test
    REFRESH_JWT_SECRET: test1
    ACCESS_JWT_EXPIRES_IN: 300
    REFRESH_JWT_EXPIRES_IN: 2592000
    OTP_SECRET: test
    OTP_ALPHABET: ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
    OTP_SIZE: 6
    OTP_EXPIRES_IN: 300
  script:
    - yarn run test:e2e
  dependencies:
    - generate_prisma_client

build_and_push_image:
  stage: build
  image: docker:29.8.0-cli-alpine3.24
  services:
    - name: docker:29.8.0-dind-alpine3.24
      alias: docker
      command:
        - "--insecure-registry=192.168.0.101:5050"
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  cache: [ ]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build --provenance=false -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest

deploy:
  stage: deploy
  image: curlimages/curl:8.12.0
  before_script: [ ]
  cache: [ ]
  script:
    - 'curl -X POST "$COOLIFY_WEBHOOK_URL" -H "Authorization: Bearer $COOLIFY_WEBHOOK_SECRET"'
