services:
  db:
    image: postgres:18-alpine
    restart: always
    container_name: kong-db
    ports:
      - "5432:5432"
    env_file:
      - .env

  db-test:
    image: postgres:18-alpine
    restart: unless-stopped
    container_name: kong-db-test
    ports:
      - "5433:5432"
    env_file:
      - .env.test

  redis:
    image: redis:8-alpine
    restart: always
    container_name: kong-redis
    ports:
      - "6379:6379"

  redis-test:
    image: redis:8-alpine
    restart: unless-stopped
    container_name: kong-redis-test
    ports:
      - "6380:6379"

  mail:
    image: axllent/mailpit:v1.29
    restart: always
    container_name: kong-mail
    ports:
      - "8025:8025"
      - "1025:1025"
