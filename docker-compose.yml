services:
  db:
    image: postgres:18-alpine
    restart: always
    container_name: kong-db
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data

  db-test:
    image: postgres:18-alpine
    restart: unless-stopped
    container_name: kong-db-test
    ports:
      - "5433:5432"
    env_file:
      - .env.e2e

  redis-om:
    image: redis/redis-stack:7.2.0-v20
    restart: always
    container_name: kong-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-om-data:/data

  redis-om-test:
    image: redis/redis-stack:7.2.0-v20
    restart: unless-stopped
    container_name: kong-redis-test
    ports:
      - "6380:6379"
      - "8002:8001"

  mail:
    image: axllent/mailpit:v1.29
    restart: always
    container_name: kong-mail
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db-data:
  redis-om-data:
